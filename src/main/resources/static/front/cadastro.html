<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta - Minhas Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="mensagem" role="alert" hidden></div>
  <main class="cartao cartao-estreito">
    <h1>Criar conta</h1>

    <form id="form-cadastro">
      <label>Nome
        <input name="nome" required maxlength="120">
      </label>
      <label>E-mail
        <input name="email" type="email" required maxlength="150" autocomplete="username">
      </label>
      <label>Idade
        <input name="idade" type="number" min="0" required>
      </label>
      <label>Senha (mínimo 6 caracteres)
        <input name="senha" type="password" required minlength="6" maxlength="72" autocomplete="new-password">
      </label>
      <button type="submit">Criar conta</button>
    </form>

    <p>Já tem uma conta? <a href="/">Entrar</a></p>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/cadastro.js"></script>
</body>
</html>
